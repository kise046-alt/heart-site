<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = {
    x: canvas.width / 2,
    y: canvas.height / 2
};

window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// Heart equation
function heart(t, scale) {
    const x = 16 * Math.sin(t) ** 3;

    const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

    return {
        x: x * scale,
        y: -y * scale
    };
}

let time = 0;

function animate() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const centerX =
        canvas.width / 2 + (mouse.x - canvas.width / 2) * 0.15;

    const centerY =
        canvas.height / 2 + (mouse.y - canvas.height / 2) * 0.15;

    // Pulsing effect
    const scale =
        10 + Math.sin(time * 0.04) * 1.5;

    ctx.beginPath();

    for (let i = 0; i <= 300; i++) {
        const t = (Math.PI * 2 * i) / 300;

        const p = heart(t, scale);

        const x = centerX + p.x;
        const y = centerY + p.y;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }

    ctx.closePath();

    // Glow
    ctx.shadowBlur = 30;
    ctx.shadowColor = "#ff1744";

    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 3;

    ctx.stroke();

    // Inner glow
    ctx.shadowBlur = 15;
    ctx.fillStyle = "rgba(255, 23, 68, 0.15)";
    ctx.fill();

    ctx.shadowBlur = 0;

    time++;

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
